<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes, maximum-scale=5" />
  <title>Marymount Auction – Committee View</title>
  <link rel="icon" type="image/png" href="/assets/Marymount%20Logo.png" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: Calibri, Arial, sans-serif;
      background-color: #e6d4ad;
      min-height: 100%;
    }

    body { overflow-x: auto; }
    * { box-sizing: border-box; }

    #loginScreen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #e6d4ad 0%, #f5e7c3 55%, #e6d4ad 100%);
      z-index: 9999;
    }

    .login-card {
      background: rgba(255,255,255,0.92);
      border-radius: 16px;
      padding: 26px 28px;
      width: 90%;
      max-width: 380px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      text-align: center;
    }

    .login-title {
      font-size: 1.5rem;
      margin-bottom: 6px;
      letter-spacing: 0.08em;
      font-weight: bold;
      text-transform: uppercase;
    }

    .login-subtitle {
      font-size: 0.9rem;
      margin-bottom: 18px;
    }

    .login-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 4px;
      text-align: left;
      font-weight: bold;
    }

    .login-input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #aaa;
      font-size: 1rem;
    }

    .login-button {
      width: 100%;
      padding: 12px;
      border: none;
      margin-top: 12px;
      border-radius: 999px;
      font-weight: bold;
      text-transform: uppercase;
      background: linear-gradient(135deg, #bc8b41, #e6ce91);
      cursor: pointer;
    }

    .login-error {
      margin-top: 6px;
      font-size: 0.8rem;
      color: red;
      min-height: 16px;
      text-align: left;
    }

    #protectedContent { display: none; }

    .header-image img {
      width: 100%;
      max-width: 600px;
      margin: 10px auto 20px auto;
      display: block;
    }

    .button-section {
      display: flex;
      justify-content: center;
      padding: 20px 0;
    }

    .custom-button {
      width: 100%;
      max-width: 280px;
      padding: 10px 16px;
      background: #bc8b41;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      color: black;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      padding: 0 5px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .auction-total-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 0.06em;
    }

    .auction-total-value {
      font-size: 1.6rem;
      font-weight: bold;
    }

    .status-summary-wrapper {
      min-width: 160px;
      text-align: right;
    }

    .status-summary-title {
      font-size: 0.85rem;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .status-summary-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 8px;
      align-items: center;
      margin-bottom: 2px;
    }

    .status-summary-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
    }

    .status-summary-count {
      font-size: 0.8rem;
      font-weight: bold;
      text-align: right;
    }

    .status-colour-box {
      width: 13px;
      height: 13px;
      border-radius: 3px;
      border: 1px solid #333;
    }

    .status-colour-below     { background: #f8d7da; }
    .status-colour-on-target { background: #fff3cd; }
    .status-colour-above     { background: #d4edda; }

    .table-section { padding: 15px; width: 100%; }

    .table-heading {
      text-align: center;
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .table-container {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      overflow-x: auto;
    }

    table { width: 100%; border-collapse: collapse; }

    thead th {
      background: black;
      color: #bc8b41;
      padding: 8px;
      border: 1px solid #ddd;
      font-size: 0.8rem;
      text-transform: uppercase;
      white-space: nowrap;
      text-align: center;
    }

    thead th.col-item { text-align: left; }

    tbody td {
      border: 1px solid #ccc;
      padding: 6px 8px;
      white-space: nowrap;
      font-size: 0.85rem;
      text-align: center;
    }

    tbody td.col-item {
      text-align: left;
      white-space: normal;
      max-width: 260px;
    }

    .status-below     { background: #f8d7da; }
    .status-on-target { background: #fff3cd; }
    .status-above     { background: #d4edda; }

    .joint-flag {
      background: #ffb347 !important;
      font-weight: bold;
      color: #5a2d00;
    }

    tr.has-joint td.col-item {
      border-left: 4px solid #e67e22;
    }

    tbody tr.alt-gold td:not(.status-below):not(.status-on-target):not(.status-above) {
      background-color: #f5ebd0;
    }

    .status-icon {
      font-size: 1.1em;
      display: inline-block;
      width: 1.2em;
      height: 1.2em;
      line-height: 1.2em;
      text-align: center;
    }

    .status-icon-below  { color: #c0392b; transform: rotate(180deg); display: inline-block; }
    .status-icon-target { color: #e67e22; transform: rotate(90deg);  display: inline-block; }
    .status-icon-above  { color: #27ae60; transform: rotate(0deg);   display: inline-block; }

    .bid-amount { font-weight: bold; }
  </style>
</head>

<body>

  <div id="loginScreen">
    <div class="login-card">
      <div class="login-title">Committee Login</div>
      <div class="login-subtitle">Enter the password to view the dashboard.</div>
      <form id="loginForm">
        <label class="login-label">Password</label>
        <input type="password" id="passwordInput" class="login-input" required />
        <button class="login-button">Unlock</button>
        <div id="loginError" class="login-error"></div>
      </form>
    </div>
  </div>

  <div id="protectedContent">

    <div class="header-image">
      <img src="/assets/LiveHeader.png" alt="Marymount Header">
    </div>

    <div class="button-section">
      <a class="custom-button" href="https://marymountauction2026.ie/bid" target="_blank">
        📝 Place an Auction Bid
      </a>
    </div>

    <div class="table-section">

      <div class="summary-row">
        <div>
          <div class="auction-total-label">AUCTION TOTAL</div>
          <div class="auction-total-value" id="auctionTotal">€0</div>
        </div>
        <div class="status-summary-wrapper">
          <div class="status-summary-title">STATUS SUMMARY</div>
          <div class="status-summary-row">
            <div class="status-summary-label">
              <span class="status-colour-box status-colour-below"></span> BELOW
            </div>
            <div class="status-summary-count" id="countBelow">0</div>
          </div>
          <div class="status-summary-row">
            <div class="status-summary-label">
              <span class="status-colour-box status-colour-on-target"></span> ON TARGET
            </div>
            <div class="status-summary-count" id="countOnTarget">0</div>
          </div>
          <div class="status-summary-row">
            <div class="status-summary-label">
              <span class="status-colour-box status-colour-above"></span> ABOVE
            </div>
            <div class="status-summary-count" id="countAbove">0</div>
          </div>
        </div>
      </div>

      <div class="table-heading">COMMITTEE VIEW</div>

      <div class="table-container">
        <table id="bidsTable">
          <thead>
            <tr>
              <th style="width:40px;"></th>
              <th class="col-item">Item</th>
              <th>Leading Bid</th>
              <th>Winner</th>
              <th>Joint</th>
              <th>Bids</th>
              <th>Low Target</th>
              <th>High Target</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

    </div>
  </div>

  <script>
    /* ============================================================
       CONFIG
       ============================================================ */
    const PASSWORD   = "starrynight";
    const SHEET_ID   = "10AMh0CR18jXCpLnjq0JccpzttTEnc8Idb_caiu_EMMc"; // DISPLAY spreadsheet
    const SHEET_TAB  = "COMMITTEE";
    const REFRESH_MS = 5000;
    /* ============================================================ */

    document.getElementById("loginForm").addEventListener("submit", e => {
      e.preventDefault();
      if (document.getElementById("passwordInput").value === PASSWORD) {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("protectedContent").style.display = "block";
        startData();
      } else {
        document.getElementById("loginError").textContent = "Incorrect password.";
      }
    });

    // No range parameter. gviz's range parameter has proven unreliable
    // elsewhere in this project (it clipped the header row differently
    // to what was requested here on first attempt), so the whole tab is
    // fetched and every column is located by header text instead. This
    // also means the request never needs updating again if columns are
    // added to COMMITTEE in future.
    const url =
      `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json` +
      `&sheet=${encodeURIComponent(SHEET_TAB)}`;

    function formatEuro(v) {
      if (v === null || v === undefined || v === "" || isNaN(v)) return "";
      return "€" + Number(v).toLocaleString("en-IE", { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    }

    function statusIcon(s) {
      const val = String(s || "").toUpperCase().trim();
      if (val === "BELOW")     return '<span class="status-icon status-icon-below">▲</span>';
      if (val === "ABOVE")     return '<span class="status-icon status-icon-above">▲</span>';
      if (val === "ON TARGET") return '<span class="status-icon status-icon-target">▲</span>';
      return "";
    }

    function statusClass(s) {
      const val = String(s || "").toUpperCase().trim();
      if (val === "BELOW")     return "status-below";
      if (val === "ABOVE")     return "status-above";
      if (val === "ON TARGET") return "status-on-target";
      return "";
    }

    const norm = s => String(s ?? "").replace(/\u00A0/g, " ").trim().toUpperCase();

    // Locates every column by its header text rather than a fixed position.
    // COMMITTEE!A1 is itself an IMPORTRANGE of LEADING_BIDS row 5 onward, so
    // its column order tracks whatever LEADING_BIDS happens to look like at
    // any given moment. A fixed index map here has already gone silently
    // out of sync with the sheet once; this is here so the next insert on
    // LEADING_BIDS fails loudly (blank dashboard, console warning) instead
    // of silently showing the wrong figure under the right header.
    //
    // gviz auto-detects the header row from a plain (no-range) request and
    // removes it from table.rows entirely, moving it into table.cols[].label
    // instead. Every row in table.rows is data; there is no header row left
    // to scan for. Column labels are read from table.cols, not from rows.
    function locateColumns(cols) {
      const labels = cols.map(c => norm(c.label));
      const find = (...names) => {
        for (const name of names) {
          const i = labels.indexOf(name);
          if (i > -1) return i;
        }
        return -1;
      };

      const idx = {
        item:       find("ITEM"),
        currentBid: find("CURRENT BID"),
        status:     find("STATUS"),
        low:        find("LOW"),
        high:       find("HIGH"),
        numBids:    find("NUMBER OF BIDS"),
        name:       find("NAME"),
        joint:      find("JOINT TOP BID"),
      };

      const required = ["item", "currentBid", "status", "low", "high"];
      const missing = required.filter(k => idx[k] === -1);
      if (missing.length) {
        console.error("COMMITTEE view: could not find column(s) "
          + missing.join(", ") + " among the sheet's column labels.", labels);
        return null;
      }

      return idx;
    }

    let loggedColumns = false;

    async function loadData() {
      try {
        const res  = await fetch(url + "&cb=" + Date.now(), { cache: "no-store" });
        const text = await res.text();
        const start = text.indexOf("{");
        const end   = text.lastIndexOf("}");
        if (start === -1 || end === -1) throw new Error("Unexpected sheet response");
        const json = JSON.parse(text.slice(start, end + 1));

        const idx = locateColumns(json.table.cols);
        if (!idx) return; // keep whatever was last shown rather than blank the dashboard

        if (!loggedColumns) {
          console.log("COMMITTEE view columns:", idx);
          loggedColumns = true;
        }

        const allRows = json.table.rows.map(r => r.c.map(c => (c ? c.v : "")));
        const dataRows = allRows.filter(r => String(r[idx.item] || "").trim() !== "");

        // Totals and counts
        let auctionTotal = 0;
        const statusCounts = { BELOW: 0, "ON TARGET": 0, ABOVE: 0 };

        // Track best bid per item for totals (multi-slot items like ITEM 07)
        const itemBest = new Map();
        dataRows.forEach(row => {
          const itemKey   = String(row[idx.item] || "").trim().toUpperCase();
          const bidNum    = Number(String(row[idx.currentBid] || "").replace(/[^\d.-]/g, "")) || 0;
          const statusVal = String(row[idx.status] || "").toUpperCase().trim();
          const existing  = itemBest.get(itemKey);
          if (!existing || bidNum > existing.bid) {
            itemBest.set(itemKey, { bid: bidNum, status: statusVal });
          }
        });

        for (const { bid, status } of itemBest.values()) {
          auctionTotal += bid;
          if (statusCounts[status] !== undefined) statusCounts[status]++;
        }

        document.getElementById("auctionTotal").textContent  = formatEuro(auctionTotal);
        document.getElementById("countBelow").textContent    = statusCounts["BELOW"];
        document.getElementById("countOnTarget").textContent = statusCounts["ON TARGET"];
        document.getElementById("countAbove").textContent    = statusCounts["ABOVE"];

        // Build table rows
        const tbody = document.querySelector("#bidsTable tbody");
        let html = "";
        let lastItem = null;
        let stripe = 0;

        dataRows.forEach(row => {
          const itemKey = String(row[idx.item] || "").trim().toUpperCase();
          if (itemKey !== lastItem) { stripe = 1 - stripe; lastItem = itemKey; }

          const item    = String(row[idx.item] || "").trim();
          const bid     = row[idx.currentBid];
          const status  = String(row[idx.status] || "").trim();
          const low     = row[idx.low];
          const high    = row[idx.high];
          const numBids = idx.numBids > -1 ? row[idx.numBids] : "";
          const name    = idx.name > -1 ? String(row[idx.name] || "").trim() : "";
          const joint   = idx.joint > -1 ? String(row[idx.joint] || "").trim() : "";
          const isJoint = joint !== "";

          const rowClass  = [stripe === 1 ? "alt-gold" : "", isJoint ? "has-joint" : ""].filter(Boolean).join(" ");
          const statClass = statusClass(status);

          html += `<tr class="${rowClass}">`;
          html += `<td class="${statClass}">${statusIcon(status)}</td>`;
          html += `<td class="col-item">${item}</td>`;
          html += `<td class="bid-amount">${formatEuro(bid)}</td>`;
          html += `<td>${name}</td>`;
          html += `<td class="${isJoint ? "joint-flag" : ""}">${joint}</td>`;
          html += `<td>${numBids !== "" && numBids != null ? numBids : ""}</td>`;
          html += `<td style="background:#f1f1f1">${formatEuro(low)}</td>`;
          html += `<td style="background:#f1f1f1">${formatEuro(high)}</td>`;
          html += `</tr>`;
        });

        tbody.innerHTML = html;

      } catch (err) {
        console.warn("COMMITTEE view: fetch skipped:", err.message);
        // Leave whatever is already on screen alone rather than blank a
        // working dashboard over one bad poll.
      }
    }

    function startData() {
      loadData();
      setInterval(loadData, REFRESH_MS);
    }
  </script>

</body>
</html>
