<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes, maximum-scale=5" />
  <title>Marymount Auction – Committee View</title>
  <link rel="icon" type="image/png" href="/assets/Marymount%20Logo.png" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: Calibri, Arial, sans-serif;
      background-color: #e6d4ad;
      min-height: 100%;
    }

    body { overflow-x: auto; }
    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    #loginScreen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #e6d4ad 0%, #f5e7c3 55%, #e6d4ad 100%);
      z-index: 9999;
    }

    .login-card {
      background: rgba(255,255,255,0.92);
      border-radius: 16px;
      padding: 26px 28px;
      width: 90%;
      max-width: 380px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      text-align: center;
    }

    .login-title {
      font-size: 1.5rem;
      margin-bottom: 6px;
      letter-spacing: 0.08em;
      font-weight: bold;
      text-transform: uppercase;
    }

    .login-subtitle {
      font-size: 0.9rem;
      margin-bottom: 18px;
    }

    .login-label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 4px;
      text-align: left;
      font-weight: bold;
    }

    .login-input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #aaa;
      font-size: 1rem;
    }

    .login-button {
      width: 100%;
      padding: 12px;
      border: none;
      margin-top: 12px;
      border-radius: 999px;
      font-weight: bold;
      text-transform: uppercase;
      background: linear-gradient(135deg, #bc8b41, #e6ce91);
      cursor: pointer;
    }

    .login-error {
      margin-top: 6px;
      font-size: 0.8rem;
      color: #a31515;
      min-height: 16px;
      text-align: left;
    }

    #protectedContent { display: none; }

    .header-image img {
      width: 100%;
      max-width: 600px;
      margin: 10px auto 20px auto;
      display: block;
    }

    .button-section {
      display: flex;
      justify-content: center;
      padding: 20px 0;
    }

    .custom-button {
      width: 100%;
      max-width: 280px;
      padding: 10px 16px;
      background: #bc8b41;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      color: black;
      text-decoration: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      padding: 0 5px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .auction-total-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      font-weight: bold;
      letter-spacing: 0.06em;
    }

    .auction-total-value {
      font-size: 1.6rem;
      font-weight: bold;
    }

    .last-updated {
      font-size: 0.75rem;
      margin-top: 4px;
    }

    .last-updated.stale {
      color: #a31515;
      font-weight: bold;
    }

    .status-summary-wrapper {
      min-width: 160px;
      text-align: right;
    }

    .status-summary-title {
      font-size: 0.85rem;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .status-summary-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 4px 8px;
      align-items: center;
      margin-bottom: 2px;
    }

    .status-summary-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
    }

    .status-summary-count {
      font-size: 0.8rem;
      font-weight: bold;
      text-align: right;
    }

    .status-colour-box {
      width: 13px;
      height: 13px;
      border-radius: 3px;
      border: 1px solid #333;
    }

    .status-colour-below     { background: #f8d7da; }
    .status-colour-on-target { background: #fff3cd; }
    .status-colour-above     { background: #d4edda; }

    .table-section { padding: 15px; width: 100%; }

    .table-heading {
      text-align: center;
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .table-container {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      overflow-x: auto;
    }

    table { width: 100%; border-collapse: collapse; }

    thead th {
      background: black;
      color: #bc8b41;
      padding: 4px 8px;
      border: 1px solid #ddd;
      font-size: 0.8rem;
      text-transform: uppercase;
      white-space: nowrap;
      text-align: center;
    }

    thead th.col-item { text-align: left; }

    .sort-btn {
      background: none;
      border: none;
      padding: 6px 4px;
      min-height: 36px;
      font: inherit;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      color: #bc8b41;
      cursor: pointer;
      text-align: inherit;
      white-space: nowrap;
    }

    .sort-btn:focus-visible {
      outline: 2px solid #bc8b41;
      outline-offset: 2px;
    }

    .sort-ind {
      display: inline-block;
      min-width: 0.9em;
      margin-left: 2px;
      font-size: 0.7em;
    }

    tbody td {
      border: 1px solid #ccc;
      padding: 6px 8px;
      white-space: nowrap;
      font-size: 0.95rem;
      text-align: center;
    }

    tbody td.col-item {
      text-align: left;
      white-space: normal;
      max-width: 260px;
    }

    .status-below     { background: #f8d7da; }
    .status-on-target { background: #fff3cd; }
    .status-above     { background: #d4edda; }

    tbody tr.alt-gold td:not(.status-below):not(.status-on-target):not(.status-above) {
      background-color: #f5ebd0;
    }

    .status-icon {
      font-size: 1.1em;
      display: inline-block;
      width: 1.2em;
      height: 1.2em;
      line-height: 1.2em;
      text-align: center;
    }

    .status-icon-below  { color: #c0392b; transform: rotate(180deg); display: inline-block; }
    .status-icon-target { color: #9a4f00; transform: rotate(90deg);  display: inline-block; }
    .status-icon-above  { color: #17663a; transform: rotate(0deg);   display: inline-block; }

    .status-word {
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      margin-left: 4px;
      vertical-align: middle;
    }

    .bid-amount { font-weight: bold; }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .filter-label {
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .filter-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 44px;
      padding: 8px 14px;
      border: 2px solid #333;
      border-radius: 999px;
      background: #fff;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
    }

    .filter-btn.active { background: #000; color: #bc8b41; border-color: #000; }
    .filter-btn.active .status-colour-box { border-color: #bc8b41; }

    .filter-reset {
      min-height: 44px;
      padding: 8px 14px;
      border: none;
      border-radius: 999px;
      background: #bc8b41;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
    }

    .filter-reset:disabled { opacity: 0.4; cursor: default; }

    .filter-count { font-size: 0.8rem; }

    .search-bar {
      display: flex;
      justify-content: center;
      margin-bottom: 8px;
    }

    .search-input {
      width: 100%;
      max-width: 420px;
      min-height: 44px;
      padding: 10px 14px;
      border: 2px solid #333;
      border-radius: 999px;
      background: #fff;
      font-family: inherit;
      font-size: 1rem;
    }

    .search-input:focus-visible {
      outline: 2px solid #bc8b41;
      outline-offset: 2px;
    }

    .resort-btn {
      min-height: 44px;
      padding: 8px 14px;
      border: 2px solid #a31515;
      border-radius: 999px;
      background: #fff;
      color: #a31515;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
    }

    .no-results td { padding: 18px; font-style: italic; }

    tfoot .total-row td {
      background: #000;
      color: #bc8b41;
      font-weight: bold;
      font-size: 1.05rem;
      border: 1px solid #000;
      text-align: center;
      white-space: normal;
      padding: 8px;
    }

    tfoot .total-row-pct td {
      font-size: 0.9rem;
      padding-top: 0;
    }

    tfoot .total-row td:first-child {
      text-align: left;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    @media (max-width: 600px) {
      .header-image img { margin: 6px auto 10px auto; }
      .table-section { padding: 10px 6px; }

      /* Top of screen: everything centred, stacked */
      .summary-row {
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 0;
      }
      .status-summary-wrapper {
        min-width: 0;
        width: 220px;
        text-align: left;
      }
      .status-summary-title { text-align: center; }

      /* Status filter: three buttons on one row */
      .filter-bar { gap: 6px; }
      .filter-label { flex-basis: 100%; text-align: center; }
      .filter-btn {
        flex: 1 1 0;
        min-width: 0;
        justify-content: center;
        gap: 4px;
        padding: 8px 4px;
        font-size: 0.7rem;
        white-space: nowrap;
      }
      .filter-reset,
      .resort-btn { font-size: 0.7rem; padding: 8px 12px; }

      /* Status column: icon only, word kept for screen readers */
      .status-word {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* Table: smaller type and tighter cells */
      thead th { font-size: 0.65rem; padding: 4px 2px; }
      .sort-btn { font-size: 0.65rem; padding: 4px 2px; }
      .sort-ind { margin-left: 0; }
      tbody td { font-size: 0.8rem; padding: 6px 3px; }
      tbody td.col-item { max-width: none; }
      tfoot .total-row td { font-size: 0.8rem; padding: 6px 3px; }
      tfoot .total-row-pct td { font-size: 0.7rem; }
    }
  </style>
</head>

<body>

  <div id="loginScreen">
    <div class="login-card">
      <div class="login-title">Committee Login</div>
      <div class="login-subtitle">Enter the password to view the dashboard.</div>
      <form id="loginForm">
        <label class="login-label" for="passwordInput">Password</label>
        <input type="password" id="passwordInput" class="login-input" autocomplete="current-password" required />
        <button class="login-button">Unlock</button>
        <div id="loginError" class="login-error" aria-live="polite"></div>
      </form>
    </div>
  </div>

  <div id="protectedContent">

    <div class="header-image">
      <img src="/assets/LiveHeader.png" alt="Marymount Header">
    </div>

    <div class="button-section">
      <a class="custom-button" href="https://marymountauction2026.ie/bid" target="_blank">
        📝 Place an Auction Bid
      </a>
    </div>

    <div class="table-section">

      <div class="summary-row">
        <div>
          <div class="auction-total-label">Total of leading bids</div>
          <div class="auction-total-value" id="auctionTotal">…</div>
          <div class="last-updated" id="lastUpdated" aria-live="polite">Loading…</div>
        </div>
        <div class="status-summary-wrapper">
          <div class="status-summary-title">STATUS SUMMARY</div>
          <div class="status-summary-row">
            <div class="status-summary-label">
              <span class="status-colour-box status-colour-below"></span> BELOW
            </div>
            <div class="status-summary-count" id="countBelow">0</div>
          </div>
          <div class="status-summary-row">
            <div class="status-summary-label">
              <span class="status-colour-box status-colour-on-target"></span> ON TARGET
            </div>
            <div class="status-summary-count" id="countOnTarget">0</div>
          </div>
          <div class="status-summary-row">
            <div class="status-summary-label">
              <span class="status-colour-box status-colour-above"></span> ABOVE
            </div>
            <div class="status-summary-count" id="countAbove">0</div>
          </div>
        </div>
      </div>

      <div class="table-heading">COMMITTEE VIEW</div>

      <div class="search-bar">
        <label class="sr-only" for="searchInput">Search items or winners</label>
        <input type="search" id="searchInput" class="search-input" placeholder="Search item or winner" autocomplete="off" />
      </div>

      <div class="filter-bar" id="filterBar">
        <span class="filter-label">Show items:</span>
        <button type="button" class="filter-btn" data-status="BELOW" aria-pressed="false"><span class="status-colour-box status-colour-below"></span>Below</button>
        <button type="button" class="filter-btn" data-status="ON TARGET" aria-pressed="false"><span class="status-colour-box status-colour-on-target"></span>On target</button>
        <button type="button" class="filter-btn" data-status="ABOVE" aria-pressed="false"><span class="status-colour-box status-colour-above"></span>Above</button>
        <button type="button" class="filter-reset" id="filterReset" disabled>Reset</button>
        <span class="filter-count" id="filterCount"></span>
        <button type="button" class="resort-btn" id="resortBtn" hidden>Bids changed. Tap to re-sort</button>
      </div>

      <div class="table-container">
        <table id="bidsTable">
          <caption class="sr-only">Bids by item. Tap a column heading to sort.</caption>
          <thead>
            <tr>
              <th><button type="button" class="sort-btn" data-sort="status">Status<span class="sort-ind" aria-hidden="true"></span></button></th>
              <th class="col-item"><button type="button" class="sort-btn" data-sort="item">Item<span class="sort-ind" aria-hidden="true"></span></button></th>
              <th><button type="button" class="sort-btn" data-sort="bid">Leading Bid<span class="sort-ind" aria-hidden="true"></span></button></th>
              <th><button type="button" class="sort-btn" data-sort="name">Winner<span class="sort-ind" aria-hidden="true"></span></button></th>
              <th><button type="button" class="sort-btn" data-sort="numBids">Bids<span class="sort-ind" aria-hidden="true"></span></button></th>
              <th><button type="button" class="sort-btn" data-sort="low">Low Target<span class="sort-ind" aria-hidden="true"></span></button></th>
              <th><button type="button" class="sort-btn" data-sort="high">High Target<span class="sort-ind" aria-hidden="true"></span></button></th>
            </tr>
          </thead>
          <tbody>
            <tr class="no-results"><td colspan="7">Loading bids…</td></tr>
          </tbody>
          <tfoot>
            <tr class="total-row">
              <td colspan="2" id="totalLabel">Total</td>
              <td class="bid-amount" id="tableTotal">…</td>
              <td colspan="2"></td>
              <td id="lowTotal">…</td>
              <td id="highTotal">…</td>
            </tr>
            <tr class="total-row total-row-pct">
              <td colspan="2">Bids as % of target</td>
              <td></td>
              <td colspan="2"></td>
              <td id="lowPct">…</td>
              <td id="highPct">…</td>
            </tr>
          </tfoot>
        </table>
      </div>

    </div>
  </div>

  <script>
    /* ============================================================
       CONFIG
       ============================================================ */
    const PASSWORD   = "starrynight";
    const SHEET_ID   = "10AMh0CR18jXCpLnjq0JccpzttTEnc8Idb_caiu_EMMc"; // DISPLAY spreadsheet
    const SHEET_TAB  = "COMMITTEE";
    const REFRESH_MS = 5000;
    const FAILS_BEFORE_WARNING = 3;
    /* ============================================================ */

    let unlocked = false;
    let pollTimer = null;

    document.getElementById("loginForm").addEventListener("submit", e => {
      e.preventDefault();
      if (document.getElementById("passwordInput").value === PASSWORD) {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("protectedContent").style.display = "block";
        startData();
      } else {
        document.getElementById("loginError").textContent = "Incorrect password.";
      }
    });

    // No range parameter. gviz's range parameter has proven unreliable
    // elsewhere in this project (it clipped the header row differently
    // to what was requested here on first attempt), so the whole tab is
    // fetched and every column is located by header text instead. This
    // also means the request never needs updating again if columns are
    // added to COMMITTEE in future.
    const url =
      `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json` +
      `&sheet=${encodeURIComponent(SHEET_TAB)}`;

    function formatEuro(v) {
      if (v === null || v === undefined || v === "" || isNaN(v)) return "";
      return "€" + Number(v).toLocaleString("en-IE", { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    }

    const STATUS_RANK  = { "BELOW": 0, "ON TARGET": 1, "ABOVE": 2 };
    const STATUS_LABEL = { "BELOW": "Below", "ON TARGET": "On target", "ABOVE": "Above" };

    function statusIcon(s) {
      const val = String(s || "").toUpperCase().trim();
      if (val === "BELOW")     return '<span class="status-icon status-icon-below" aria-hidden="true">▲</span>';
      if (val === "ABOVE")     return '<span class="status-icon status-icon-above" aria-hidden="true">▲</span>';
      if (val === "ON TARGET") return '<span class="status-icon status-icon-target" aria-hidden="true">▲</span>';
      return "";
    }

    function statusClass(s) {
      const val = String(s || "").toUpperCase().trim();
      if (val === "BELOW")     return "status-below";
      if (val === "ABOVE")     return "status-above";
      if (val === "ON TARGET") return "status-on-target";
      return "";
    }

    const norm = s => String(s ?? "").replace(/ /g, " ").trim().toUpperCase();

    // Text and number readers for cells. Blank cells come back as null.
    function cellText(v) {
      return String(v ?? "").replace(/ /g, " ").trim();
    }

    function cellNum(v) {
      if (v === null || v === undefined || v === "") return null;
      const n = typeof v === "number" ? v : Number(String(v).replace(/[^\d.-]/g, ""));
      return Number.isFinite(n) ? n : null;
    }

    // Locates every column by its header text rather than a fixed position.
    // COMMITTEE!A1 is itself an IMPORTRANGE of LEADING_BIDS row 5 onward, so
    // its column order tracks whatever LEADING_BIDS happens to look like at
    // any given moment. A fixed index map here has already gone silently
    // out of sync with the sheet once; this is here so the next insert on
    // LEADING_BIDS fails loudly (blank dashboard, console warning) instead
    // of silently showing the wrong figure under the right header.
    //
    // gviz auto-detects the header row from a plain (no-range) request and
    // removes it from table.rows entirely, moving it into table.cols[].label
    // instead. Every row in table.rows is data; there is no header row left
    // to scan for. Column labels are read from table.cols, not from rows.
    function locateColumns(cols) {
      const labels = cols.map(c => norm(c.label));
      const find = (...names) => {
        for (const name of names) {
          const i = labels.indexOf(name);
          if (i > -1) return i;
        }
        return -1;
      };

      const idx = {
        item:       find("ITEM"),
        currentBid: find("CURRENT BID"),
        status:     find("STATUS"),
        low:        find("LOW"),
        high:       find("HIGH"),
        numBids:    find("NUMBER OF BIDS"),
        name:       find("NAME"),
      };

      const required = ["item", "currentBid", "status", "low", "high"];
      const missing = required.filter(k => idx[k] === -1);
      if (missing.length) {
        console.error("COMMITTEE view: could not find column(s) "
          + missing.join(", ") + " among the sheet's column labels.", labels);
        return null;
      }

      return idx;
    }

    // ---- Sorting ----
    // Tap a heading once for its default direction, again to reverse, a third
    // time to return to sheet order. Blank values always sort to the bottom.
    // Ties fall back to item order.
    const SORTERS = {
      status:  { dir0: 1,  get: (r, x) => { const k = cellText(r[x.status]).toUpperCase(); return Object.prototype.hasOwnProperty.call(STATUS_RANK, k) ? STATUS_RANK[k] : null; } },
      item:    { dir0: 1,  get: (r, x) => cellText(r[x.item]) || null },
      bid:     { dir0: -1, get: (r, x) => cellNum(r[x.currentBid]) },
      name:    { dir0: 1,  get: (r, x) => (x.name > -1 ? cellText(r[x.name]) : "") || null },
      numBids: { dir0: -1, get: (r, x) => (x.numBids > -1 ? cellNum(r[x.numBids]) : null) },
      low:     { dir0: -1, get: (r, x) => cellNum(r[x.low]) },
      high:    { dir0: -1, get: (r, x) => cellNum(r[x.high]) },
    };

    let sortKey = null;   // null means sheet order
    let sortDir = 0;      // 1 ascending, -1 descending
    let heldKeys = null;  // item order held while the sort is active
    let orderChanged = false;

    const itemKey = (r) => cellText(r[lastIdx.item]).toUpperCase();

    function sortRows(rows, x) {
      const get = SORTERS[sortKey].get;
      const decorated = rows.map((r, i) => ({ r, i, v: get(r, x) }));
      decorated.sort((p, q) => {
        if (p.v === null || q.v === null) {
          if (p.v === null && q.v === null) return p.i - q.i;
          return p.v === null ? 1 : -1;
        }
        let c = typeof p.v === "string"
          ? p.v.localeCompare(q.v, undefined, { numeric: true, sensitivity: "base" }) * sortDir
          : (p.v - q.v) * sortDir;
        if (c === 0) {
          c = cellText(p.r[x.item]).localeCompare(cellText(q.r[x.item]), undefined, { numeric: true });
        }
        return c || p.i - q.i;
      });
      return decorated.map(d => d.r);
    }

    // While a sort is active, the order is held so rows do not jump on each
    // refresh. Values update in place. When the live order differs from the
    // held order, the re-sort button appears.
    function orderRows(rows, x) {
      if (!sortKey) {
        heldKeys = null;
        orderChanged = false;
        return rows;
      }
      if (!heldKeys) {
        const live = sortRows(rows, x);
        heldKeys = live.map(itemKey);
        orderChanged = false;
        return live;
      }
      const byKey = new Map(rows.map(r => [itemKey(r), r]));
      const heldSet = new Set(heldKeys);
      const heldPresent = heldKeys.filter(k => byKey.has(k));
      const held = heldPresent.map(k => byKey.get(k));
      const fresh = rows.filter(r => !heldSet.has(itemKey(r)));

      const live = sortRows(rows, x).map(itemKey).filter(k => heldSet.has(k));
      orderChanged = live.join("|") !== heldPresent.join("|");

      return held.concat(fresh);
    }

    function updateSortHeaders() {
      document.querySelectorAll(".sort-btn").forEach(btn => {
        const th = btn.closest("th");
        const ind = btn.querySelector(".sort-ind");
        const key = btn.dataset.sort;
        if (key === sortKey) {
          th.setAttribute("aria-sort", sortDir === 1 ? "ascending" : "descending");
          ind.textContent = sortDir === 1 ? "▲" : "▼";
        } else {
          th.setAttribute("aria-sort", "none");
          ind.textContent = "";
        }
      });
    }

    document.querySelectorAll(".sort-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const key = btn.dataset.sort;
        const d0 = SORTERS[key].dir0;
        if (sortKey !== key) {
          sortKey = key;
          sortDir = d0;
        } else if (sortDir === d0) {
          sortDir = -d0;
        } else {
          sortKey = null;
          sortDir = 0;
        }
        heldKeys = null;
        renderTable();
      });
    });

    document.getElementById("resortBtn").addEventListener("click", () => {
      heldKeys = null;
      renderTable();
    });

    // ---- Target status filter ----
    // Selected statuses persist across the refresh. None selected = show all.
    // Totals and the status summary above always cover every item, unfiltered.
    const activeFilters = new Set();
    let searchText = "";
    let lastRows = [];
    let lastIdx  = null;

    function renderTable() {
      updateSortHeaders();
      if (!lastIdx) return;
      const idx = lastIdx;
      const filtering = activeFilters.size > 0;
      const query = searchText.trim().toLowerCase();
      const searching = query !== "";
      const narrowed = filtering || searching;

      const matchesSearch = r =>
        !searching
        || cellText(r[idx.item]).toLowerCase().includes(query)
        || (idx.name > -1 && cellText(r[idx.name]).toLowerCase().includes(query));

      const ordered = orderRows(lastRows, idx);
      const rows = ordered.filter(r =>
        (!filtering || activeFilters.has(norm(r[idx.status]))) && matchesSearch(r));

      const tbody = document.querySelector("#bidsTable tbody");
      let html = "";

      rows.forEach((row, i) => {
        const item    = cellText(row[idx.item]);
        const bid     = row[idx.currentBid];
        const status  = cellText(row[idx.status]);
        const low     = row[idx.low];
        const high    = row[idx.high];
        const numBids = idx.numBids > -1 ? row[idx.numBids] : "";
        const name    = idx.name > -1 ? cellText(row[idx.name]) : "";
        const label   = STATUS_LABEL[norm(status)] || "";

        const rowClass  = i % 2 === 0 ? "alt-gold" : "";
        const statClass = statusClass(status);

        html += `<tr class="${rowClass}">`;
        html += `<td class="${statClass}">${statusIcon(status)}<span class="status-word">${label}</span></td>`;
        html += `<td class="col-item">${item}</td>`;
        html += `<td class="bid-amount">${formatEuro(bid)}</td>`;
        html += `<td>${name}</td>`;
        html += `<td>${numBids !== "" && numBids != null ? numBids : ""}</td>`;
        html += `<td style="background:#f1f1f1">${formatEuro(low)}</td>`;
        html += `<td style="background:#f1f1f1">${formatEuro(high)}</td>`;
        html += `</tr>`;
      });

      if (!rows.length) {
        html = `<tr class="no-results"><td colspan="7">No items match. Try another search or clear the filters.</td></tr>`;
      }
      tbody.innerHTML = html;

      document.querySelectorAll(".filter-btn").forEach(b => {
        const on = activeFilters.has(b.dataset.status);
        b.classList.toggle("active", on);
        b.setAttribute("aria-pressed", String(on));
      });
      document.getElementById("filterReset").disabled = !narrowed;
      document.getElementById("filterCount").textContent =
        narrowed ? `Showing ${rows.length} of ${lastRows.length} rows` : "";
      // Footer totals. Unfiltered they are full totals. Filtered they are
      // subtotals of the rows on screen. Items with no bid yet count as
      // zero in the bid total but their targets still count, so the
      // percentages start low and rise as bids come in.
      const sumOf = fn => rows.reduce((s, row) => s + (fn(row) ?? 0), 0);
      const bidSum  = sumOf(row => cellNum(row[idx.currentBid]));
      const lowSum  = sumOf(row => cellNum(row[idx.low]));
      const highSum = sumOf(row => cellNum(row[idx.high]));
      const pct = (part, whole) => whole > 0 ? `${Math.round(part / whole * 100)}%` : "n/a";

      document.getElementById("tableTotal").textContent = formatEuro(bidSum);
      document.getElementById("lowTotal").textContent   = formatEuro(lowSum);
      document.getElementById("highTotal").textContent  = formatEuro(highSum);
      document.getElementById("lowPct").textContent     = pct(bidSum, lowSum);
      document.getElementById("highPct").textContent    = pct(bidSum, highSum);
      document.getElementById("totalLabel").textContent = narrowed
        ? `Subtotal, ${rows.length} of ${lastRows.length} items`
        : "Total";

      document.getElementById("resortBtn").hidden = !(sortKey && orderChanged);
    }

    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const s = btn.dataset.status;
        if (activeFilters.has(s)) activeFilters.delete(s); else activeFilters.add(s);
        renderTable();
      });
    });

    document.getElementById("filterReset").addEventListener("click", () => {
      activeFilters.clear();
      searchText = "";
      document.getElementById("searchInput").value = "";
      renderTable();
    });

    document.getElementById("searchInput").addEventListener("input", e => {
      searchText = e.target.value;
      renderTable();
    });

    // ---- Freshness ----
    let loggedColumns = false;
    let failCount = 0;
    let lastOkTime = null;

    const clock = d => d.toLocaleTimeString("en-IE", { hour: "2-digit", minute: "2-digit" });

    function showUpdated() {
      const el = document.getElementById("lastUpdated");
      el.textContent = "Updated " + clock(lastOkTime);
      el.classList.remove("stale");
    }

    function showStale() {
      const el = document.getElementById("lastUpdated");
      el.textContent = lastOkTime
        ? `Connection problem. Last update ${clock(lastOkTime)}. Retrying.`
        : "Cannot load bids yet. Retrying.";
      el.classList.add("stale");
    }

    async function loadData() {
      try {
        const res  = await fetch(url + "&cb=" + Date.now(), { cache: "no-store" });
        const text = await res.text();
        const start = text.indexOf("{");
        const end   = text.lastIndexOf("}");
        if (start === -1 || end === -1) throw new Error("Unexpected sheet response");
        const json = JSON.parse(text.slice(start, end + 1));

        const idx = locateColumns(json.table.cols);
        if (!idx) throw new Error("Column headings changed");

        if (!loggedColumns) {
          console.log("COMMITTEE view columns:", idx);
          loggedColumns = true;
        }

        const allRows = json.table.rows.map(r => r.c.map(c => (c ? c.v : "")));
        const dataRows = allRows.filter(r => String(r[idx.item] || "").trim() !== "");

        // Totals and counts
        let auctionTotal = 0;
        const statusCounts = { BELOW: 0, "ON TARGET": 0, ABOVE: 0 };

        // Track best bid per item for totals (multi-slot items like ITEM 07)
        const itemBest = new Map();
        dataRows.forEach(row => {
          const itemKeyVal = String(row[idx.item] || "").trim().toUpperCase();
          const bidNum    = Number(String(row[idx.currentBid] || "").replace(/[^\d.-]/g, "")) || 0;
          const statusVal = String(row[idx.status] || "").toUpperCase().trim();
          const existing  = itemBest.get(itemKeyVal);
          if (!existing || bidNum > existing.bid) {
            itemBest.set(itemKeyVal, { bid: bidNum, status: statusVal });
          }
        });

        for (const { bid, status } of itemBest.values()) {
          auctionTotal += bid;
          if (statusCounts[status] !== undefined) statusCounts[status]++;
        }

        document.getElementById("auctionTotal").textContent  = formatEuro(auctionTotal);
        document.getElementById("countBelow").textContent    = statusCounts["BELOW"];
        document.getElementById("countOnTarget").textContent = statusCounts["ON TARGET"];
        document.getElementById("countAbove").textContent    = statusCounts["ABOVE"];

        lastRows = dataRows;
        lastIdx  = idx;
        renderTable();

        failCount = 0;
        lastOkTime = new Date();
        showUpdated();

      } catch (err) {
        failCount++;
        console.warn("COMMITTEE view: fetch skipped:", err.message);
        // Keep whatever is on screen. Warn only after several failed polls,
        // so one bad poll does not alarm anyone.
        if (failCount >= FAILS_BEFORE_WARNING) showStale();
      }
    }

    // ---- Polling: pauses when the tab is hidden, resumes on return ----
    function startPolling() {
      if (pollTimer) return;
      pollTimer = setInterval(loadData, REFRESH_MS);
    }

    function stopPolling() {
      clearInterval(pollTimer);
      pollTimer = null;
    }

    document.addEventListener("visibilitychange", () => {
      if (!unlocked) return;
      if (document.hidden) {
        stopPolling();
      } else {
        loadData();
        startPolling();
      }
    });

    function startData() {
      unlocked = true;
      loadData();
      startPolling();
    }
  </script>

</body>
</html>
