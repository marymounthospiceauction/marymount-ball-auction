    // Item numbers the viewer has expanded, and the current filter text.

    const openItems = new Set();

    function parseCsv(text) {
      const rows = []; let row = ['']; let quote = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i], n = text[i + 1];
        if (c === '"') {
          if (quote && n === '"') { row[row.length - 1] += '"'; i++; }
          else { quote = !quote; }
        } else if (c === ',' && !quote) {
          row.push('');
        } else if ((c === '\r' || c === '\n') && !quote) {
          if (c === '\r' && n === '\n') i++;
          rows.push(row);
          row = [''];
        } else {
          row[row.length - 1] += c;
        }
      }
      rows.push(row);
      return rows;
    }

    const norm = s => String(s ?? '').replace(/ /g, ' ').trim().toUpperCase();

    function locateColumns(rows) {
      for (let r = 0; r < Math.min(rows.length, 10); r++) {
        const cells = rows[r].map(norm);
        const descCols = [];
        cells.forEach((v, i) => { if (v.endsWith('ITEM DESCRIPTION')) descCols.push(i); });
        if (descCols.length < BLOCK) continue;

        const descCol  = descCols[BLOCK - 1];
        const blockEnd = descCols[BLOCK] ?? cells.length;

        let bidCol = -1, liveCol = -1, soldCol = -1;
        for (let i = descCol + 1; i < blockEnd; i++) {
          if (cells[i] === 'LEADING BID')  bidCol  = i;
          if (cells[i] === 'LIVE STATUS')  liveCol = i;
          if (cells[i] === 'SOLD STATUS')  soldCol = i;
        }
        if (bidCol === -1) continue;

        return { headerRow: r, descCol, bidCol, liveCol, soldCol };
      }
      return null;
    }

    function escHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function itemNum(raw) {
      const m = String(raw ?? '').match(/ITEM\s*0*(\d+)/i);
      return m ? Number(m[1]) : null;
    }

    function formatItemLabel(raw) {
      const src = String(raw ?? '')
        .replace(/ /g, ' ')
        .replace(/[‐-―−]/g, '-')
        .trim();
      const m = src.match(/^ITEM\s*0*(\d+)\s*-?\s*(.*)/i);
      if (!m) return escHtml(src);
      const num  = m[1].padStart(2, '0');
      const rest = m[2].trim();
      return '<strong>ITEM ' + num + '</strong>'
           + (rest ? '&nbsp;- ' + escHtml(rest) : '');
    }

    function formatEuro(v) {
      if (!v || v === '') return '€0';
      const n = Number(String(v).replace(/[^0-9.-]/g, ''));
      return isNaN(n) ? escHtml(v) : '€' + n.toLocaleString('en-IE');
    }

      return '<tr class="detail-row' + (open ? '' : ' hidden') + '" data-detail="' + num + '">'

    function showMessage(msg) {
      document.querySelector('#bidsTable tbody').innerHTML =
        '<tr><td colspan="2" style="text-align:center;color:#8a2b20;padding:14px;">'
        + escHtml(msg) + '</td></tr>';
    }

    // Matches "14", "item 14", "ITEM 14" by number, anything else by text
    // in the item name. Hides the item row and its detail row together.
    function matchesFilter(num, text) {
      const q = filterText.trim().toLowerCase();
      if (!q) return true;
      const digits = q.replace(/^item\s*/, '');
      if (/^\d+$/.test(digits)) return num === Number(digits);
      return text.toLowerCase().includes(q);
    }

    function applyFilter() {
      const tbody = document.querySelector('#bidsTable tbody');
      let visible = 0;
      tbody.querySelectorAll('tr.item-row[data-item]').forEach(row => {
        const num = Number(row.dataset.item);
        const ok = matchesFilter(num, row.textContent);
        row.classList.toggle('filtered-out', !ok);
        const detail = tbody.querySelector('tr.detail-row[data-detail="' + num + '"]');
        if (detail) detail.classList.toggle('filtered-out', !ok);
        if (ok) visible++;
      });
      const nm = document.getElementById('noMatch');
      if (filterText.trim() && visible === 0) {
        nm.textContent = 'No items match "' + filterText.trim() + '". Try an item number or part of the name.';
        nm.hidden = false;
      } else {
        nm.hidden = true;
      }
    }

    let loggedColumns = false;

    async function loadData() {
      let rows;
      try {
        const res = await fetch(GVIZ_URL + '&cb=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        rows = parseCsv(await res.text());
      } catch (err) {
        console.warn('Leading bids fetch skipped:', err.message);
        return;
      }

      const cols = locateColumns(rows);
      if (!cols) {
        console.warn('Leading bids poll returned no usable data, keeping last known values.');
        return;
      }

      if (!loggedColumns) {
        console.log('Leading bids: header row ' + cols.headerRow
          + ', description col ' + cols.descCol
          + ', leading bid col ' + cols.bidCol);
        loggedColumns = true;
      }

      let html = '';
      let count = 0;

      for (let r = cols.headerRow + 1; r < rows.length; r++) {
        const label = String(rows[r][cols.descCol] ?? '').trim();
        if (!label) continue;

        const raw = String(rows[r][cols.bidCol] ?? '').trim();
        const liveVal = cols.liveCol > -1 ? norm(rows[r][cols.liveCol]) : '';
        const soldVal = cols.soldCol > -1 ? norm(rows[r][cols.soldCol]) : '';
        const isLive  = liveVal === 'LIVE';
        const isSold  = soldVal === 'SOLD';

        let rowClass = 'item-row';
        let priceCell;

        if (isSold) {
          rowClass += ' is-sold';
          priceCell = formatEuro(raw) + '<span class="sold-tag">SOLD</span>';
        } else if (isLive) {
          rowClass += ' is-live';
          priceCell = '🟢 LIVE';
        } else {
          priceCell = formatEuro(raw);
        }

        const num = itemNum(label);
        const hasDetail = num !== null && DETAILS[num];
        const open = hasDetail && openItems.has(num);
        if (open) rowClass += ' open';

        const toggle = hasDetail
          ? '<span class="toggle" aria-expanded="' + open + '">' + (open ? 'Hide' : 'Details') + '</span>'
          : '';

        html += '<tr class="' + rowClass + '"' + (hasDetail ? ' data-item="' + num + '"' : '') + '>'
             +    '<td><div class="cell"><span class="label">' + formatItemLabel(label) + '</span>' + toggle + '</div></td>'
             +    '<td>' + priceCell + '</td>'
             +  '</tr>';
        if (hasDetail) html += detailRow(num, open);
        count++;
      }

      if (!count) {
        console.warn('Leading bids poll parsed but found no item rows, keeping last known values.');
        return;
      }

      document.querySelector('#bidsTable tbody').innerHTML = html;
      applyFilter();
    }

    // One handler on the table body, so it survives the 5 second rebuilds.
    document.querySelector('#bidsTable tbody').addEventListener('click', e => {
      const row = e.target.closest('tr.item-row[data-item]');
      if (!row) return;
      const num = Number(row.dataset.item);
      const detail = document.querySelector('tr.detail-row[data-detail="' + num + '"]');
      const nowOpen = !openItems.has(num);
      if (nowOpen) openItems.add(num); else openItems.delete(num);
      row.classList.toggle('open', nowOpen);
      if (detail) detail.classList.toggle('hidden', !nowOpen);
      const t = row.querySelector('.toggle');
      if (t) { t.textContent = nowOpen ? 'Hide' : 'Details'; t.setAttribute('aria-expanded', nowOpen); }
    });

    document.getElementById('filterInput').addEventListener('input', e => {
      filterText = e.target.value;
      applyFilter();
    });

    showMessage('Loading bids…');
    loadData();
    setInterval(loadData, REFRESH_MS);
  </script>

</body>
</html>
