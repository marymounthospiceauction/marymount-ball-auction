<!DOCTYPE html>
<html lang="en-IE">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#e6d4ad" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Live Auction Marymount</title>
<link rel="icon" href="/assets/favicon.png" />

<style>
:root{
  --sand:#e6d4ad;
  --sand-dk:#cfb98c;
  --card:#fffdf8;
  --ink:#1a1a1a;
  --muted:#6b6250;
  --line:#e0d2b4;
  --gold:#bc8b41;
  --gold-dk:#8a6425;
  --green:#1c7f45;
  --green-dk:#125c31;
  --red:#b42318;
  --amber:#8a5f00;
  --amber-bg:#fdf2d4;
  --char:#1d1b17;
  --bar-h:56px;
  --tabs-h:64px;
  --safe-b:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:Calibri,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--sand);color:var(--ink);
  font-size:17px;line-height:1.35;
  overscroll-behavior-y:contain;
}
button,input{font-family:inherit;touch-action:manipulation}
button{cursor:pointer}

/* LOGIN */
#login{
  position:fixed;inset:0;z-index:900;
  display:flex;align-items:center;justify-content:center;padding:20px;
  background:linear-gradient(155deg,#e6d4ad,#f7ebce 55%,#dfc99e);
}
.login-card{
  background:#fff;border-radius:22px;padding:30px 22px;
  width:100%;max-width:340px;text-align:center;
  box-shadow:0 16px 44px rgba(0,0,0,.22);
}
.login-card h1{margin:0 0 2px;font-size:1.15rem;letter-spacing:.08em;text-transform:uppercase}
.login-card p{margin:0 0 22px;font-size:.88rem;color:var(--muted)}
.login-card input{
  width:100%;height:56px;padding:0 14px;font-size:17px;
  border:2px solid var(--line);border-radius:14px;background:var(--card);
}
.login-card input:focus{outline:none;border-color:var(--gold)}
.login-card button{
  width:100%;height:56px;margin-top:14px;border:none;border-radius:999px;
  font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;
  background:var(--gold);color:#fff;
}
#loginMsg{margin-top:12px;min-height:18px;font-size:.85rem;font-weight:700;color:var(--red)}

/* SHELL */
#app{display:none;padding-bottom:calc(var(--tabs-h) + var(--safe-b) + 28px)}

.masthead{padding:6px 10px 0}
.masthead img{
  display:block;margin:0 auto;border-radius:8px;
  width:auto;height:auto;max-width:100%;max-height:22vh;
}
.masthead img.gone{display:none}

.bar{
  position:sticky;top:0;z-index:60;height:var(--bar-h);
  display:flex;align-items:center;gap:10px;
  padding:0 12px;margin-top:6px;
  background:var(--sand);border-bottom:1px solid var(--sand-dk);
}
.bar h1{flex:1;min-width:0;margin:0;font-size:.95rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.pill{display:flex;align-items:center;gap:7px;font-size:.74rem;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.pill i{width:9px;height:9px;border-radius:50%;background:#9a927e}
.pill.ok i{background:var(--green)}
.pill.sync i{background:#d99a1c;animation:pulse 1s infinite}
.pill.off i{background:var(--red)}
.pill.off{color:var(--red)}
#refresh{
  width:42px;height:42px;padding:0;border-radius:50%;
  border:1px solid var(--sand-dk);background:#fff;
  display:flex;align-items:center;justify-content:center;
}
#refresh svg{width:20px;height:20px;stroke:var(--char);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#refresh.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.18)}}

.wrap{padding:0 10px;max-width:600px;margin:0 auto}
.pane{display:none}
.pane.on{display:block}

h2.sect{margin:18px 2px 8px;font-size:.76rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:#544c3b}

/* SKELETON */
.skel{
  height:130px;border-radius:20px;margin:14px 0;
  background:linear-gradient(90deg,#efe3c4 25%,#f7eed8 37%,#efe3c4 63%);
  background-size:400% 100%;animation:shim 1.3s ease infinite;
}
@keyframes shim{0%{background-position:100% 50%}100%{background-position:0 50%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* EMPTY */
.empty-card{
  margin-top:14px;padding:30px 20px;text-align:center;
  background:var(--card);border:1px solid var(--line);border-radius:20px;
}
.empty-t{font-size:1.1rem;font-weight:800;margin-bottom:4px}
.empty-card p{margin:0 0 16px;color:var(--muted);font-size:.92rem}
.empty-card .btn{max-width:280px;margin:0 auto}

/* LOT CARD (on the block, awaiting winner) */
.lot{
  background:#fff;border:1px solid #d9c79f;border-radius:22px;overflow:hidden;
  margin-bottom:14px;box-shadow:0 8px 22px rgba(60,40,10,.15);
}
.lot-head{
  display:flex;align-items:center;gap:14px;padding:14px 16px;
  background:linear-gradient(160deg,#28251f,#171512);color:#fff;
}
.lot-num{
  flex:0 0 auto;min-width:58px;height:58px;padding:0 8px;border-radius:15px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#dcb262,#bc8b41);color:#1a1408;
  font-size:1.55rem;font-weight:800;font-variant-numeric:tabular-nums;
}
.lot-meta{min-width:0;flex:1}
.lot-tag{display:block;font-size:.64rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:#e6c27a}
.lot-name{margin:2px 0;font-size:1.1rem;line-height:1.22;font-weight:800;color:#fff}
.lot-sub{font-size:.8rem;color:#cbbf9f}
.lot-price{font-size:1.3rem;font-weight:800;color:#f1d089;font-variant-numeric:tabular-nums}
.lot.syncing .lot-head{opacity:.88}
.lot-body{padding:16px}

.lbl{display:block;margin:0 0 6px;font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#463f31}
.lbl.gap{margin-top:14px}

.price-box{
  display:flex;align-items:center;height:78px;padding:0 18px;
  border:2px solid var(--line);border-radius:18px;background:var(--card);
}
.price-box:focus-within{border-color:var(--gold);box-shadow:0 0 0 4px rgba(188,139,65,.2)}
.price-box .cur{font-size:2rem;font-weight:800;color:var(--gold-dk);margin-right:8px}
.price-box input{
  flex:1;min-width:0;height:100%;border:none;background:transparent;outline:none;
  font-size:2.5rem;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;
}
.price-box input::placeholder{color:#cdbf9c}

.in{
  width:100%;height:56px;padding:0 16px;font-size:17px;
  border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);
}
.in:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(188,139,65,.2)}

.hint{min-height:18px;margin-top:6px;font-size:.78rem;color:var(--muted)}
.hint.bad{color:var(--red);font-weight:700}
.hint.warn{color:var(--amber);font-weight:700}
.hint.ok{color:var(--green);font-weight:700}

.btn{
  display:block;width:100%;min-height:62px;margin-top:12px;border:none;border-radius:17px;
  font-size:17px;font-weight:800;letter-spacing:.04em;
  transition:transform .08s ease,opacity .15s ease;
}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{background:#ddd5c0;color:#8b8370}
.btn-sell{background:linear-gradient(180deg,#25965a,#1c7f45);color:#fff;box-shadow:0 6px 16px rgba(28,127,69,.35)}
.btn-notify{background:linear-gradient(180deg,#cf9d4d,#bc8b41);color:#fff;box-shadow:0 6px 16px rgba(188,139,65,.35)}
.btn-gold{background:linear-gradient(180deg,#cf9d4d,#bc8b41);color:#fff}
.btn:disabled{box-shadow:none}
.linkbtn{
  display:block;width:100%;min-height:46px;margin-top:6px;border:none;background:none;
  font-size:.8rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);
}

/* ITEMS */
.searchbar{
  position:sticky;top:var(--bar-h);z-index:40;
  padding:10px 0 8px;background:var(--sand);
}
.search{
  width:100%;height:56px;padding:0 16px;font-size:17px;
  border:2px solid var(--line);border-radius:16px;background:#fff;
}
.search:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(188,139,65,.2)}
.count{margin:6px 4px 0;font-size:.76rem;font-weight:700;color:var(--muted)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-top:8px}
.row{
  display:flex;align-items:center;gap:12px;width:100%;min-height:70px;
  padding:11px 13px;border:none;border-bottom:1px solid #f0e7d2;
  background:transparent;text-align:left;color:var(--ink);
}
.row:last-child{border-bottom:none}
.row:active{background:#f7eed9}
.rn{
  flex:0 0 auto;min-width:46px;padding:9px 6px;text-align:center;border-radius:10px;
  background:#f1e6cd;color:#6b5a35;font-size:.86rem;font-weight:800;font-variant-numeric:tabular-nums;
}
.row-main{flex:1;min-width:0}
.row-name{display:block;font-weight:700;font-size:.98rem;line-height:1.25}
.row-lead{display:block;margin-top:2px;font-size:.78rem;color:var(--muted)}
.row-go{
  flex:0 0 auto;padding:10px 16px;border:1.5px solid var(--gold);border-radius:999px;
  font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-dk);
}

/* SOLD */
.sold-card{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-top:14px;padding:18px;border-radius:20px;
  background:linear-gradient(160deg,#28251f,#171512);color:#fff;
}
.sold-k{font-size:.66rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:#e6c27a}
.sold-n{font-size:.9rem;color:#cbbf9f}
.sold-total{font-size:2rem;font-weight:800;color:#f1d089;font-variant-numeric:tabular-nums}
.srow{display:flex;align-items:center;gap:12px;padding:12px 13px;border-bottom:1px solid #f0e7d2}
.srow:last-child{border-bottom:none}
.srow-name{flex:1;min-width:0;font-size:.94rem;font-weight:600}
.srow-amt{font-weight:800;font-variant-numeric:tabular-nums}

/* TABS */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  display:grid;grid-template-columns:repeat(3,1fr);
  padding:0 6px var(--safe-b);
  background:rgba(238,225,192,.96);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-top:1px solid var(--sand-dk);
}
.tab{
  position:relative;height:var(--tabs-h);border:none;background:none;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--char)}
.tab.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
.badge{
  position:absolute;top:6px;left:calc(50% + 8px);min-width:20px;height:20px;padding:0 6px;
  border-radius:999px;background:var(--char);color:#f1d089;
  font-size:.72rem;line-height:20px;text-align:center;font-weight:800;
}
.badge.hot{background:var(--red);color:#fff;animation:pulse 1.4s infinite}
.badge[hidden]{display:none}

/* TOASTS */
#toasts{
  position:fixed;left:10px;right:10px;z-index:80;
  bottom:calc(var(--tabs-h) + var(--safe-b) + 10px);
  display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;
}
.toast{
  pointer-events:auto;width:100%;max-width:560px;
  display:flex;align-items:center;gap:12px;justify-content:space-between;
  padding:14px 16px;border-radius:16px;color:#fff;font-size:.92rem;font-weight:700;
  background:var(--char);box-shadow:0 10px 28px rgba(0,0,0,.35);
  animation:rise .16s ease-out;
}
.toast.err{background:var(--red)}
.toast.warn{background:#7a5200}
.toast button{
  flex:0 0 auto;padding:8px 12px;border:1px solid rgba(255,255,255,.5);border-radius:10px;
  background:transparent;color:#fff;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}

/* CONFIRM SHEET */
#modal{position:fixed;inset:0;z-index:800;display:none;background:rgba(24,18,8,.55)}
#modal.show{display:flex;align-items:flex-end;justify-content:center}
.sheet{
  width:100%;max-width:520px;background:#fff;
  border-radius:24px 24px 0 0;padding:14px 20px calc(18px + var(--safe-b));
  animation:rise .18s ease-out;
}
.grab{width:42px;height:5px;border-radius:3px;background:#e2d9c3;margin:0 auto 14px}
.sheet h3{margin:0 0 12px;font-size:1.1rem}
.m-item{display:flex;align-items:center;gap:14px}
.m-num{
  min-width:56px;height:56px;padding:0 8px;border-radius:15px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#dcb262,#bc8b41);color:#1a1408;font-size:1.5rem;font-weight:800;
}
.m-name{font-size:1.08rem;font-weight:800;line-height:1.22}
.m-sub{font-size:.82rem;color:var(--muted)}
.conseq{margin:14px 0 0;padding:12px 13px;border-radius:12px;background:var(--amber-bg);color:#5f4200;font-size:.85rem}
.sheet button{
  display:block;width:100%;min-height:58px;margin-top:10px;border:none;border-radius:16px;
  font-size:17px;font-weight:800;letter-spacing:.04em;
}
.mo-go{background:var(--green);color:#fff}
.mo-go.danger{background:var(--gold-dk)}
.mo-cancel{background:#f0ebdf;color:#4a4335}
@media(min-width:560px){
  #modal.show{align-items:center}
  .sheet{border-radius:24px}
  .grab{display:none}
}
</style>
</head>

<body>

<div id="login">
  <form class="login-card" id="loginForm">
    <h1>Live auction</h1>
    <p>Committee admin</p>
    <input type="password" id="pw" autocomplete="current-password" placeholder="Password" required />
    <button type="submit">Unlock</button>
    <div id="loginMsg"></div>
  </form>
</div>

<div id="app">

  <div class="masthead">
    <img id="masthead" src="/assets/LiveHeader.png" alt="The Starry Night Ball" />
  </div>

  <header class="bar">
    <h1>Live auction</h1>
    <span class="pill sync" id="pill"><i></i><span id="pillTxt">Loading</span></span>
    <button id="refresh" type="button" aria-label="Refresh">
      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
    </button>
  </header>

  <main class="wrap">
    <section id="pane-block" class="pane on"><div id="blockWrap"></div></section>

    <section id="pane-items" class="pane">
      <div class="searchbar">
        <input class="search" id="search" type="search" inputmode="search" placeholder="Search number or name" autocomplete="off" />
        <div class="count" id="itemCount"></div>
      </div>
      <div id="itemsWrap"></div>
    </section>

    <section id="pane-sold" class="pane"><div id="soldWrap"></div></section>
  </main>

  <nav class="tabs" id="tabs">
    <button class="tab on" type="button" data-act="tab" data-tab="block" aria-selected="true">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/></svg>
      On the block
      <span class="badge" id="badgeBlock" hidden>0</span>
    </button>
    <button class="tab" type="button" data-act="tab" data-tab="items" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg>
      Send live
    </button>
    <button class="tab" type="button" data-act="tab" data-tab="sold" aria-selected="false">
      <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      Sold
    </button>
  </nav>
</div>

<div id="toasts" aria-live="polite"></div>

<div id="modal">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="grab"></div>
    <h3 id="mTitle"></h3>
    <div class="m-item">
      <span class="m-num" id="mNum"></span>
      <div><div class="m-name" id="mName"></div><div class="m-sub" id="mSub"></div></div>
    </div>
    <p class="conseq" id="mConseq"></p>
    <button class="mo-go" id="mGo" type="button">Confirm</button>
    <button class="mo-cancel" id="mCancel" type="button">Cancel</button>
  </div>
</div>

<script>
"use strict";

/* CONFIG */
var PASSWORD     = "Brendan2026";
var ADMIN_SECRET = "mh_control_#2026#";
var SCRIPT_URL   = "https://script.google.com/macros/s/AKfycby1YsQ-4o26Krk7zWMn7hVuQLnvAVhTTygVo6nbqIKnExx0yGvQqsiyE1lr8mbWC7rnKg/exec";
var POLL_MS      = 10000;

/* STATE */
var data        = { live: [], available: [], sold: [], duplicates: [] };
var pendingList = [];                       /* sold, awaiting winner details */
var drafts      = { price: {}, name: {}, mobile: {} };
var expect      = {};                       /* sales recorded but not yet seen in pendingList */
var sending     = {};
var filter      = "";
var loaded      = false;
var firstDone   = false;
var touched     = false;
var inflight    = 0;
var writeGen    = 0;
var loadId      = 0;
var loadActive  = false;
var lastSig     = "";
var confirmRun  = null;
var counts      = {};
var dupKeys     = {};

/* HELPERS */
function $(id){ return document.getElementById(id); }

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function euro(n){
  return "\u20AC" + (Number(n) || 0).toLocaleString("en-IE",{maximumFractionDigits:0});
}

function fmtNum(d){ return d ? Number(d).toLocaleString("en-IE") : ""; }

function now(){
  return new Date().toLocaleTimeString("en-IE",{hour:"2-digit",minute:"2-digit"});
}

function buzz(p){ try { if (navigator.vibrate) navigator.vibrate(p); } catch(e){} }

function numOf(it){
  return String(it.itemLabel || it.itemNumber || "").replace(/^ITEM\s*/i,"").trim();
}

/* One stable key per item number, so typed drafts survive re-renders. */
function keyOf(it){
  var raw = (it.itemNumber != null && it.itemNumber !== "") ? it.itemNumber : (it.itemLabel || "");
  var d = String(raw).replace(/\D/g,"");
  if (d) return "n" + Number(d);
  return "r" + String(it.rowId != null ? it.rowId : it.settingsRow);
}

function byRow(list, rowId){
  for (var i = 0; i < list.length; i++){
    if (String(list[i].rowId) === String(rowId)) return list[i];
  }
  return null;
}

function byKey(list, k){
  for (var i = 0; i < list.length; i++){
    if (keyOf(list[i]) === k) return list[i];
  }
  return null;
}

/* Items whose number appears more than once never go to a live auction. */
function prep(){
  counts = {}; dupKeys = {};
  ["available","live","sold"].forEach(function(n){
    (data[n] || []).forEach(function(it){ var k = keyOf(it); counts[k] = (counts[k] || 0) + 1; });
  });
  (data.duplicates || []).forEach(function(d){ dupKeys[keyOf({ itemNumber:d })] = 1; });
}

function isMulti(it){
  var k = keyOf(it);
  return it.duplicate === true || counts[k] > 1 || !!dupKeys[k];
}

/* TOASTS */
function toast(kind, msg, id){
  var box = $("toasts");
  if (id){
    var old = box.querySelector('[data-tid="' + id + '"]');
    if (old) old.remove();
  }
  var t = document.createElement("div");
  t.className = "toast " + kind;
  if (id) t.setAttribute("data-tid", id);

  var m = document.createElement("span");
  m.textContent = msg;
  t.appendChild(m);

  if (kind === "err" || kind === "warn"){
    var x = document.createElement("button");
    x.type = "button"; x.textContent = "Dismiss";
    x.addEventListener("click", function(){ t.remove(); });
    t.appendChild(x);
    buzz([60,40,60]);
  } else {
    setTimeout(function(){ t.remove(); }, 3500);
    buzz(25);
  }

  box.appendChild(t);
  while (box.children.length > 3) box.firstChild.remove();
}

function clearToast(id){
  var el = $("toasts").querySelector('[data-tid="' + id + '"]');
  if (el) el.remove();
}

function setPill(state){
  $("pill").className = "pill " + state;
  $("pillTxt").textContent = state === "ok" ? now() : state === "sync" ? "Syncing" : "Offline";
}

/* API */
function api(payload){
  var ctl   = ("AbortController" in window) ? new AbortController() : null;
  var timer = ctl ? setTimeout(function(){ ctl.abort(); }, 25000) : 0;

  return fetch(SCRIPT_URL, {
    method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body:JSON.stringify(payload),
    signal: ctl ? ctl.signal : undefined
  })
  .then(function(r){ return r.text(); })
  .then(function(t){
    clearTimeout(timer);
    var j;
    try { j = JSON.parse(t); }
    catch(e){ throw new Error("The server sent something unreadable. Check the deployment URL."); }
    if (!j.ok) throw new Error(j.message || "The request was refused.");
    return j;
  })
  .catch(function(e){
    clearTimeout(timer);
    if (e && e.name === "AbortError") throw new Error("The server took too long to answer.");
    if (e instanceof TypeError) throw new Error("No connection.");
    throw e;
  });
}

/* LOAD */
function normalise(d){
  d = d || {};
  return {
    live:       d.live       || [],
    available:  d.available  || [],
    sold:       d.sold       || [],
    duplicates: d.duplicates || []
  };
}

function load(manual){
  var id  = ++loadId;
  var gen = writeGen;
  loadActive = true;
  setPill("sync");
  $("refresh").classList.add("spin");

  return Promise.all([
    api({ action:"getCommitteeItems" }),
    api({ action:"getPendingWinners" })
  ])
  .then(function(res){
    /* Drop results that a newer load or a write has overtaken. */
    if (id !== loadId || gen !== writeGen || inflight > 0) return;

    data        = normalise(res[0].data);
    pendingList = (res[1].data && res[1].data.pending) || [];
    loaded      = true;
    reconcileExpected();
    clearToast("load");
    setPill("ok");

    var sig = JSON.stringify([data, pendingList]);
    if (sig !== lastSig || !firstDone){
      lastSig = sig;
      renderAll();
    }

    if (!firstDone){
      firstDone = true;
      if (!touched) setTab((data.live.length || pendingList.length) ? "block" : "items");
    }
  })
  .catch(function(err){
    if (id !== loadId) return;
    setPill("off");
    if (manual || !loaded) toast("err", "Could not load items. " + err.message, "load");
  })
  .then(function(){
    if (id === loadId){
      loadActive = false;
      $("refresh").classList.remove("spin");
    }
  });
}

/* A recorded sale can take a moment to show in the pending list.
   Keep it on screen and re check rather than let it vanish. */
function reconcileExpected(){
  Object.keys(expect).forEach(function(k){
    var e = expect[k];
    if (byKey(pendingList, k)){ delete expect[k]; return; }
    e.tries++;
    if (e.tries > 3){
      delete expect[k];
      toast("warn", e.entry.itemLabel + " was recorded but is not listed under awaiting winner details. Refresh. If it is still missing, take the winner details by hand.");
      return;
    }
    pendingList = pendingList.concat([e.entry]);
    setTimeout(function(){ load(); }, 2500);
  });
}

/* Change the screen first, confirm with the server after, undo if it fails. */
function transact(o){
  var snap = JSON.stringify({ d:data, p:pendingList });
  writeGen++; inflight++;
  setPill("sync");
  o.optimistic();
  renderAll();

  return o.call().then(
    function(j){
      inflight--;
      o.ok(j);
      renderAll();
      return load();
    },
    function(err){
      inflight--;
      var s = JSON.parse(snap);
      data = s.d; pendingList = s.p;
      renderAll();
      o.fail(err);
      return load();
    }
  );
}

/* RENDER */
function withFocus(fn){
  var a  = document.activeElement;
  var id = a && a.id ? a.id : null;
  var s = null, e = null;
  if (id){ try { s = a.selectionStart; e = a.selectionEnd; } catch(x){} }
  fn();
  if (id){
    var el = $(id);
    if (el && (el.tagName === "INPUT")){
      try { el.focus({ preventScroll:true }); } catch(x){ el.focus(); }
      if (s != null){ try { el.setSelectionRange(s, e); } catch(x){} }
    }
  }
}

function renderAll(){
  prep();
  withFocus(renderBlock);
  renderItems();
  renderSold();
  renderTabs();
}

function skel(n){
  var h = "";
  for (var i = 0; i < n; i++) h += '<div class="skel"></div>';
  return h;
}

  return '' +
    '<article class="lot' + (it._syncing ? ' syncing' : '') + '">' +

        '<div class="lot-num">' + esc(numOf(it)) + '</div>' +
        '<div class="lot-meta">' +
          '<span class="lot-tag">' + (it._syncing ? 'Sending live' : 'On the block') + '</span>' +
          '<h3 class="lot-name">' + esc(it.description) + '</h3>' +
          '<div class="lot-sub">Silent auction reached ' + euro(it.leadBid) + '</div>' +
        '</div>' +
      '</header>' +
      '<div class="lot-body">' +
        '<label class="lbl" for="wp-' + k + '">Hammer price</label>' +
        '<div class="price-box"><span class="cur">\u20AC</span>' +
          '<input id="wp-' + k + '" data-in="price" data-key="' + k + '" type="tel" inputmode="numeric" autocomplete="off" placeholder="0" value="' + esc(v) + '" />' +
        '</div>' +
        '<div class="hint" id="wph-' + k + '"></div>' +
        '<button class="btn btn-sell" id="ws-' + k + '" data-act="sell" data-row="' + r + '" data-key="' + k + '" type="button" disabled>Enter the hammer price</button>' +
        '<button class="linkbtn" data-act="undo" data-row="' + r + '" type="button">Not live, put it back</button>' +

}

function pendCard(it){
  var k = keyOf(it);
  var nm = esc(drafts.name[k] || "");
  var mb = esc(drafts.mobile[k] || "");
  return '' +
    '<article class="lot' + (it._syncing ? ' syncing' : '') + '">' +
      '<header class="lot-head">' +
        '<div class="lot-num">' + esc(numOf(it)) + '</div>' +
        '<div class="lot-meta">' +
          '<span class="lot-tag">Sold</span>' +
          '<h3 class="lot-name">' + esc(it.description) + '</h3>' +
          '<div class="lot-price">' + euro(it.price) + '</div>' +
        '</div>' +
      '</header>' +
      '<div class="lot-body">' +
        '<label class="lbl" for="pn-' + k + '">Winner name</label>' +
        '<input class="in" id="pn-' + k + '" data-in="name" data-key="' + k + '" type="text" autocomplete="off" autocapitalize="words" placeholder="Full name" value="' + nm + '" />' +
        '<label class="lbl gap" for="pm-' + k + '">Winner mobile</label>' +
        '<input class="in" id="pm-' + k + '" data-in="mobile" data-key="' + k + '" type="tel" inputmode="tel" autocomplete="off" placeholder="087 123 4567" value="' + mb + '" />' +
        '<div class="hint" id="pmh-' + k + '"></div>' +
        '<button class="btn btn-notify" id="pb-' + k + '" data-act="notify" data-row="' + esc(it.settingsRow) + '" data-item="' + esc(it.itemNumber) + '" data-key="' + k + '" type="button" disabled>Enter the winner\u2019s name</button>' +
      '</div>' +
    '</article>';

function renderBlock(){
  var w = $("blockWrap");

  if (!loaded){ w.innerHTML = skel(2); return; }

  var h = "";
  if (data.live.length){
    h += '<h2 class="sect">On the block</h2>' + data.live.map(liveCard).join("");
  }
  if (pendingList.length){
    h += '<h2 class="sect">Awaiting winner details</h2>' + pendingList.map(pendCard).join("");
  }
  if (!h){
    h = '<div class="empty-card">' +
          '<div class="empty-t">Nothing on the block</div>' +
          '<p>Pick the next item when the chairman calls it.</p>' +
          '<button class="btn btn-gold" data-act="tab" data-tab="items" type="button">Choose an item</button>' +
        '</div>';
  }

  w.innerHTML = h;
  data.live.forEach(function(it){ syncSellBtn(keyOf(it)); });
  pendingList.forEach(function(it){ syncNotifyBtn(keyOf(it)); });
}

function renderItems(){
  var w = $("itemsWrap");

  if (!loaded){ w.innerHTML = skel(3); return; }

  var f    = filter.trim().toLowerCase();
  var all  = data.available.filter(function(it){ return !isMulti(it); });
  var list = f ? all.filter(function(it){
    return (it.itemLabel + " " + it.description).toLowerCase().indexOf(f) !== -1;
  }) : all;

  if (/^\d+$/.test(f)){
    var n = Number(f);
    var exact = list.filter(function(it){ return Number(numOf(it).replace(/\D/g,"")) === n; });
    list = exact.concat(list.filter(function(it){ return exact.indexOf(it) === -1; }));
  }

  $("itemCount").textContent = f ? (list.length + " of " + all.length) : (all.length + " available");

  if (!all.length){
    w.innerHTML = '<div class="empty-card"><div class="empty-t">Every item is live or sold</div></div>';
    return;
  }
  if (!list.length){
    w.innerHTML = '<div class="empty-card"><div class="empty-t">No match</div><p>Try the item number.</p></div>';
    return;
  }

  w.innerHTML = '<div class="panel">' + list.map(function(it){
    return '' +
      '<button class="row" type="button" data-act="live" data-row="' + esc(it.rowId) + '">' +
        '<span class="rn">' + esc(numOf(it)) + '</span>' +
        '<span class="row-main">' +
          '<span class="row-name">' + esc(it.description) + '</span>' +
          '<span class="row-lead">Silent bid ' + euro(it.leadBid) + '</span>' +
        '</span>' +
        '<span class="row-go">Live</span>' +
      '</button>';
  }).join("") + '</div>';
}

function renderSold(){
  var w = $("soldWrap");
  if (!loaded){ w.innerHTML = skel(1); return; }

  var total = data.sold.reduce(function(a,b){ return a + (Number(b.leadBid) || 0); }, 0);
  var n = data.sold.length;

  var h = '<div class="sold-card"><div><div class="sold-k">Sold tonight</div>' +
          '<div class="sold-n">' + n + (n === 1 ? ' item' : ' items') + '</div></div>' +
          '<div class="sold-total">' + euro(total) + '</div></div>';

  if (n){
    h += '<div class="panel">' + data.sold.map(function(it){
      return '<div class="srow"><span class="rn">' + esc(numOf(it)) + '</span>' +
             '<span class="srow-name">' + esc(it.description) + '</span>' +
             '<span class="srow-amt">' + euro(it.leadBid) + '</span></div>';
    }).join("") + '</div>';
  }
  w.innerHTML = h;
}

function renderTabs(){
  var n = data.live.length + pendingList.length;
  var b = $("badgeBlock");
  b.textContent = n;
  b.hidden = !n;
  b.classList.toggle("hot", n > 0);
}

function setTab(t){
  ["block","items","sold"].forEach(function(n){
    $("pane-" + n).classList.toggle("on", n === t);
    var btn = document.querySelector('.tab[data-tab="' + n + '"]');
    btn.classList.toggle("on", n === t);
    btn.setAttribute("aria-selected", n === t ? "true" : "false");
  });
  window.scrollTo(0, 0);
}

/* BUTTON STATES */
function syncSellBtn(k){
  var btn = $("ws-" + k), hint = $("wph-" + k);
  if (!btn) return;

  var it = byKey(data.live, k);
  var digits = drafts.price[k] || "";
  var n = Number(digits);

  hint.className = "hint";
  hint.textContent = "";

  if (it && it._syncing){ btn.disabled = true; btn.textContent = "Sending live"; return; }
  if (!digits || n <= 0){ btn.disabled = true; btn.textContent = "Enter the hammer price"; return; }

  btn.disabled = false;
  btn.textContent = "Sold for " + euro(n);

  if (it && n < Number(it.leadBid || 0)){
    hint.className = "hint warn";
    hint.textContent = "Below the silent bid of " + euro(it.leadBid) + ". Check before you tap.";
  } else if (n >= 100000){
    hint.className = "hint warn";
    hint.textContent = "That is " + euro(n) + ". Check the zeros.";
  }
}

function syncNotifyBtn(k){
  var b = $("pb-" + k), h = $("pmh-" + k);
  if (!b) return;

  var it   = byKey(pendingList, k);
  var name = (drafts.name[k] || "").trim();
  var mob  = drafts.mobile[k] || "";
  var ok   = !!mob && mobileOk(mob);

  if (h){
    if (ok){ h.className = "hint ok"; h.textContent = "Sends to " + tidyMobile(mob); }
    else   { h.className = "hint";    h.textContent = "Irish 08x, or UK as 0044"; }
  }

  if (sending[k])               { b.disabled = true;  b.textContent = "Sending"; }
  else if (it && it._syncing)   { b.disabled = true;  b.textContent = "Recording sale"; }
  else if (!name)               { b.disabled = true;  b.textContent = "Enter the winner\u2019s name"; }
  else if (!ok)                 { b.disabled = true;  b.textContent = "Enter a valid mobile"; }
  else                          { b.disabled = false; b.textContent = "Send winner WhatsApp"; }
}

/* CONFIRM SHEET */
function ask(o){
  confirmRun = o.run;
  $("mTitle").textContent  = o.title;
  $("mNum").textContent    = o.num;
  $("mName").textContent   = o.name;
  $("mSub").textContent    = o.sub || "";
  $("mConseq").textContent = o.consequence;
  $("mGo").textContent     = o.go || "Confirm";
  $("mGo").classList.toggle("danger", !!o.danger);
  $("modal").classList.add("show");
  document.body.style.overflow = "hidden";
}

function closeModal(){
  $("modal").classList.remove("show");
  document.body.style.overflow = "";
  confirmRun = null;
}

/* MOBILE NUMBER */
function tidyMobile(v){
  var s = String(v || "").trim().replace(/[\s\-()\.]/g,"");
  if (s.indexOf("+353") === 0)       s = "0" + s.slice(4);
  else if (s.indexOf("+44") === 0)   s = "0044" + s.slice(3);
  else if (s.indexOf("00353") === 0) s = "0" + s.slice(5);
  else if (/^353\d{9}$/.test(s))     s = "0" + s.slice(3);
  return s;
}

function mobileOk(v){
  var s = tidyMobile(v);
  if (!/^\d+$/.test(s)) return false;
  if (s.indexOf("08") === 0)   return s.length === 10;
  if (s.indexOf("0044") === 0) return s.length === 14;
  return false;
}

/* ACTIONS */
function goLive(rowId){
  var it = byRow(data.available, rowId);
  if (!it) return;

  ask({
    title: "Send this item live?",
    num: numOf(it),
    name: it.description,
    sub: "Silent bid " + euro(it.leadBid),
    consequence: "It leaves the bidding form straight away. Guests part way through a bid on it are told it is unavailable.",
    go: "Send live",
    run: function(){
      transact({
        optimistic: function(){
          data.available = data.available.filter(function(x){ return String(x.rowId) !== String(it.rowId); });
          var copy = Object.assign({}, it, { _syncing:true });
          data.live = data.live.concat([copy]);
          filter = ""; $("search").value = "";
          touched = true; setTab("block");
        },
        call: function(){
          return api({ action:"markItemLive", secret:ADMIN_SECRET, rowId:it.rowId, itemNumber:it.itemNumber });
        },
        ok: function(){
          var x = byRow(data.live, it.rowId);
          if (x) delete x._syncing;
          toast("ok", it.itemLabel + " is live");
        },
        fail: function(err){
          toast("err", it.itemLabel + " did not go live. " + err.message + " Check the list before trying again.");
        }
      });
    }
  });
}

function putBack(rowId){
  var it = byRow(data.live, rowId);
  if (!it) return;

  ask({
    title: "Put this item back?",
    num: numOf(it),
    name: it.description,
    sub: "",
    consequence: "It returns to the bidding form and guests can bid on it again. Use this only if it went live by mistake.",
    go: "Put it back",
    danger: true,
    run: function(){
      var k = keyOf(it);
      var msg = null;
      transact({
        optimistic: function(){
          data.live = data.live.filter(function(x){ return String(x.rowId) !== String(it.rowId); });
          var back = Object.assign({}, it);
          delete back._syncing;
          data.available = data.available.concat([back]);
          delete drafts.price[k];
        },
        call: function(){
          return api({ action:"undoItemLive", secret:ADMIN_SECRET, rowId:it.rowId, itemNumber:it.itemNumber });
        },
        ok: function(j){
          toast(j.formulaMissing ? "warn" : "ok", j.message || (it.itemLabel + " is back on the form"));
        },
        fail: function(err){
          toast("err", it.itemLabel + " was not put back. " + err.message);
        }
      });
    }
  });
}

/* No confirm dialog on a sale. The button shows the amount instead. */
function sell(rowId, k){
  var it = byRow(data.live, rowId);
  if (!it || it._syncing) return;

  var price = drafts.price[k] || "";
  if (!price || Number(price) <= 0) return;

  var entry = {
    settingsRow: it.rowId,
    itemNumber:  it.itemNumber,
    itemLabel:   it.itemLabel,
    description: it.description,
    price:       Number(price),
    _syncing:    true
  };

  transact({
    optimistic: function(){
      data.live = data.live.filter(function(x){ return String(x.rowId) !== String(it.rowId); });
      pendingList = pendingList.concat([entry]);
    },
    call: function(){
      return api({
        action:"recordSalePrice", secret:ADMIN_SECRET,
        rowId:it.rowId, itemNumber:it.itemNumber, soldPrice:price
      });
    },
    ok: function(j){
      delete drafts.price[k];
      expect[k] = { entry:entry, tries:0 };
      if (j.overlayOk === false){
        toast("warn", it.itemLabel + " sale recorded, but the sold overlay may not have fired on the screens.");
      } else {
        toast("ok", it.itemLabel + " sold for " + euro(price));
      }
    },
    fail: function(err){
      toast("err", it.itemLabel + " sale was not recorded. " + err.message + " Check the screens, then try again.");
    }
  });
}

function notify(k, settingsRow, itemNumber){
  if (sending[k]) return;

  var name = (drafts.name[k] || "").trim();
  var mob  = drafts.mobile[k] || "";
  if (!name || !mobileOk(mob)) return;

  sending[k] = true;
  syncNotifyBtn(k);
  writeGen++; inflight++;
  setPill("sync");

  api({
    action:"sendWinnerNotice", secret:ADMIN_SECRET,
    rowId:settingsRow, itemNumber:itemNumber,
    winnerName:name, winnerMobile:tidyMobile(mob)
  })
  .then(function(j){
    inflight--; delete sending[k];
    pendingList = pendingList.filter(function(p){ return keyOf(p) !== k; });
    delete drafts.name[k]; delete drafts.mobile[k]; delete expect[k];
    renderAll();
    if (j.whatsappOk === false){
      toast("warn", "Saved, but the WhatsApp to " + name + " did not send. Tell them in person. " + (j.whatsappError || ""));
    } else {
      toast("ok", j.message || ("Winner notice sent to " + name));
    }
    return load();
  }, function(err){
    inflight--; delete sending[k];
    syncNotifyBtn(k);
    toast("err", "Not sent. " + err.message);
    return load();
  });
}

/* EVENTS */
$("loginForm").addEventListener("submit", function(e){
  e.preventDefault();
  if ($("pw").value === PASSWORD){
    try { sessionStorage.setItem("ca_ok", "1"); } catch(x){}
    unlock();
  } else {
    $("loginMsg").textContent = "That password is not right.";
    $("pw").select();
  }
});

$("refresh").addEventListener("click", function(){ load(true); });

$("search").addEventListener("input", function(e){
  filter = e.target.value;
  renderItems();
});

$("mCancel").addEventListener("click", closeModal);

$("mGo").addEventListener("click", function(){
  var run = confirmRun;
  closeModal();
  if (run) run();
});

$("modal").addEventListener("click", function(e){
  if (e.target === $("modal")) closeModal();
});

document.addEventListener("keydown", function(e){
  if (e.key === "Escape" && confirmRun) closeModal();
});

/* Delegation, so apostrophes such as WINE LOVER'S DREAM
   cannot break a handler and cards can be rebuilt freely. */
document.addEventListener("click", function(e){
  var el = e.target.closest("[data-act]");
  if (!el) return;
  var act = el.getAttribute("data-act");
  var row = el.getAttribute("data-row");
  var k   = el.getAttribute("data-key");

  if (act === "live")        goLive(row);
  else if (act === "undo")   putBack(row);
  else if (act === "sell")   sell(row, k);
  else if (act === "notify") notify(k, row, el.getAttribute("data-item"));
  else if (act === "tab"){ touched = true; setTab(el.getAttribute("data-tab")); }
});

document.addEventListener("input", function(e){
  var t = e.target;
  var kind = t.getAttribute && t.getAttribute("data-in");
  if (!kind) return;
  var k = t.getAttribute("data-key");

  if (kind === "price"){
    var caret = t.selectionStart;
    var before = t.value.slice(0, caret).replace(/\D/g,"").length;
    var digits = t.value.replace(/\D/g,"").replace(/^0+/,"").slice(0,7);
    drafts.price[k] = digits;
    var f = fmtNum(digits);
    t.value = f;
    var pos = 0, seen = 0;
    while (pos < f.length && seen < before){ if (/\d/.test(f.charAt(pos))) seen++; pos++; }
    try { t.setSelectionRange(pos, pos); } catch(x){}
    syncSellBtn(k);
  } else if (kind === "name"){
    drafts.name[k] = t.value;
    syncNotifyBtn(k);
  } else if (kind === "mobile"){
    drafts.mobile[k] = t.value;
    syncNotifyBtn(k);
  }
});

document.addEventListener("focusout", function(e){
  var t = e.target;
  if (!t.getAttribute || t.getAttribute("data-in") !== "mobile") return;
  var k = t.getAttribute("data-key");
  var v = t.value.trim();
  var h = $("pmh-" + k);
  if (v && !mobileOk(v) && h){
    h.className = "hint bad";
    h.textContent = "Irish mobiles are 10 digits starting 08. UK mobiles start 0044.";
  }
});

$("masthead").addEventListener("error", function(){ this.classList.add("gone"); });

/* START */
var wakeLock = null;
function keepAwake(){
  try {
    if ("wakeLock" in navigator && !document.hidden){
      navigator.wakeLock.request("screen").then(function(l){ wakeLock = l; }).catch(function(){});
    }
  } catch(x){}
}

function unlock(){
  $("login").style.display = "none";
  $("app").style.display   = "block";
  renderAll();
  load();
  keepAwake();

  setInterval(function(){
    if (document.hidden || inflight > 0 || loadActive || confirmRun) return;
    load();
  }, POLL_MS);

  document.addEventListener("visibilitychange", function(){
    if (!document.hidden){ keepAwake(); if (!inflight) load(); }
  });
}

try { if (sessionStorage.getItem("ca_ok") === "1") unlock(); } catch(x){}
